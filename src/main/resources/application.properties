# Store and read all timestamps (Instant createdAt/modifiedAt columns) using
# America/New_York wall-clock time, instead of the JVM/driver default (UTC).
# Without this, Hibernate writes/reads DATETIME columns using the server's
# default time zone, so raw createdAt/modifiedAt values in the database do
# not match New York time even though the app formats them as NY time on display.
spring.jpa.properties.hibernate.jdbc.time_zone=America/New_York

